modid: examplemod
base_package: com.example.examplemod
mod_class: ExampleMod

items:
  - id: cheese
    display_name: Cheese
    texture: cheese
    stack_size: 64
    food:
      nutrition: 4
      saturation: 0.5
    custom_class: true
    behavior:
      on_finish_eating:
        effects:
          - type: speed
            duration: 300
            amplifier: 3
          - type: glowing
            duration: 300
            amplifier: 1
          - type: jump_boost
            duration: 300
            amplifier: 5
      on_use:
        lightning: true

  - id: op_pickaxe
    display_name: OP Pickaxe
    texture: op_pickaxe
    stack_size: 1
    custom_class: true

  - id: transmutation_wand
    display_name: Transmutation Wand
    texture: transmutation_wand
    stack_size: 1
    custom_class: true

  - id: transmutation_wand_handle
    display_name: Transmutation Wand Handle
    texture: transmutation_wand_handle
    stack_size: 64

  - id: transmutation_wand_head
    display_name: Transmutation Wand Head
    texture: transmutation_wand_head
    stack_size: 64

blocks:
  - id: linstead_block
    display_name: Linstead Block
    textures:
      all: linstead_block
    hardness: 2.0
    resistance: 3.0
    drops: self

  - id: mouse_block
    display_name: Mouse Block
    textures:
      all: mouse_block
    hardness: 2.0
    resistance: 3.0
    drops: self

  - id: lol_block
    display_name: LOL Block
    textures:
      all: lol_block
    hardness: 3.0
    resistance: 3.0
    light_level: 15
    drops: self

  - id: cheese_block
    display_name: Cheese Block
    textures:
      all: cheese_block
    hardness: 2.0
    resistance: 3.0
    light_level: 15
    drops: cheese

  - id: trampoline_block
    display_name: Trampoline Block
    textures:
      all: trampoline_block
    hardness: 1.0
    resistance: 2.0
    light_level: 0
    behavior:
      bounce_strength: 1.3
      fall_damage_multiplier: 0.3
    drops: self

  - id: corgi_dispenser_block
    display_name: Corgi Dispenser Block
    textures:
      all: corgi_dispenser_block
    hardness: 1.0
    resistance: 6.0
    light_level: 10
    sound_type: stone
    drops: self

  - id: boom_block
    display_name: Boom Block
    textures:
      all: boom_block
    hardness: 1.0
    resistance: 30.0
    drops: self
    behavior:
      explosion:
        power: 3.0
        interaction: block

  - id: rubiks_block
    display_name: Rubiks Block
    textures:
      down: rubiks_block/rubiks_block_white
      up: rubiks_block/rubiks_block_yellow
      north: rubiks_block/rubiks_block_green
      south: rubiks_block/rubiks_block_blue
      west: rubiks_block/rubiks_block_orange
      east: rubiks_block/rubiks_block_red
    hardness: 2.0
    resistance: 3.0
    drops: self

recipes:
  - id: transmutation_wand_recipe
    type: shaped
    pattern:
      - " H "
      - " A "
      - " A "
    key:
      H:
        item: transmutation_wand_head
      A:
        item: transmutation_wand_handle
    result: transmutation_wand

  - id: cheese_block_from_cheese
    type: shaped
    pattern:
      - "CCC"
      - "CCC"
      - "CCC"
    key:
      C:
        item: cheese
    result: cheese_block

  - id: cheese_from_cheese_block
    type: shapeless
    ingredients:
      - item: cheese_block
    result: cheese
    count: 9

creative_tab:
  id: custom_items_2
  display_name: Custom Items
  icon: linstead_block

sounds:
  - id: corgi_bark
    file: corgi_bark
